<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Sonda</title>
<!--
  Monta el sitio en un iframe del tamaño exacto de un dispositivo. Es la única
  forma fiable de comprobar el responsive: dentro del iframe, vw, svh y las
  media queries resuelven contra ese tamaño y no contra la ventana real.

    ?w=390&h=844    teléfono
    ?w=1440&h=900   escritorio
-->
<style>
  body { margin: 0; display: flex; gap: 16px; background: #1c1c1c; color: #eee;
         font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #marco { flex: 0 0 auto; border: 0; background: #000; }
  #lado { flex: 1 1 auto; padding: 16px 16px 40px 0; max-height: 100vh; overflow: auto; }
  button { font: inherit; padding: 6px 14px; background: #eee; border: 0; cursor: pointer; }
  h2 { font-size: 13px; margin: 18px 0 6px; color: #9ad; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 8px 2px 0; vertical-align: top; }
  td:first-child { color: #999; white-space: nowrap; }
  .ok::before  { content: "OK  "; color: #7c7; }
  .mal::before { content: "MAL "; color: #f77; }
  .mal { color: #f99; }
  #resumen { margin-top: 14px; font-weight: 700; }
</style>

<iframe id="marco" src="../index.html"></iframe>
<div id="lado">
  <button id="run">Comprobar</button>
  <span id="tam"></span>
  <div id="salida"></div>
  <div id="resumen"></div>
</div>

<script>
const p = new URLSearchParams(location.search);
const W = +(p.get('w') || 390), H = +(p.get('h') || 844);
const marco = document.getElementById('marco');
marco.style.width = W + 'px';
marco.style.height = H + 'px';
// ?escala=0.55 encoge el iframe *visualmente* para poder ver un render de
// escritorio completo en un panel angosto. La maquetación se sigue calculando
// contra W x H, así que las medidas no cambian.
const ESCALA = +(p.get('escala') || 1);
if (ESCALA !== 1) {
  marco.style.transformOrigin = 'top left';
  marco.style.transform = 'scale(' + ESCALA + ')';
  marco.style.marginRight = (W * (ESCALA - 1)) + 'px';
  marco.style.marginBottom = (H * (ESCALA - 1)) + 'px';
}
// ?lang=en comprueba la maquetación con los textos ingleses, que no miden lo
// mismo: el iframe es del mismo origen, así que basta con dejar la elección
// puesta antes de que cargue.
const LANG = p.get('lang') === 'en' ? 'en' : 'es';
try { localStorage.setItem('augurio:idioma', LANG); } catch (e) {}
document.getElementById('tam').textContent =
  ` ${W}x${H} ${W <= 900 ? '(móvil)' : '(escritorio)'} · ${LANG.toUpperCase()}`;

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

// Espera a que una condición se cumpla en vez de a un reloj. Con cuatro campos
// de puntos y mil doscientas letras en marcha, el repintado tras un scroll
// puede tardar bastante más que un plazo fijo, y una espera corta lee el
// estado anterior y da un fallo falso.
const esperarA = async (fn, ms) => {
  const fin = performance.now() + (ms || 4000);
  for (;;) {
    if (fn()) return true;
    if (performance.now() > fin) return false;
    await esperar(120);
  }
};
const rect = (d, sel) => {
  const e = d.querySelector(sel);
  if (!e) return null;
  const r = e.getBoundingClientRect();
  return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) };
};

const pruebas = [];
const comprobar = (nombre, cond, detalle) => pruebas.push({ nombre, ok: !!cond, detalle });

async function correr() {
  pruebas.length = 0;
  const salida = document.getElementById('salida');
  salida.innerHTML = '<p>cargando…</p>';

  // recarga limpia: sin esto el iframe reutiliza el documento anterior y se
  // mide un estado viejo, que ya dio una lectura falsa una vez
  await new Promise((r) => { marco.onload = r; marco.src = '../index.html?v=' + Date.now(); });
  const w = marco.contentWindow, d = w.document;
  await esperar(2000);

  // Medir contra el viewport real de dentro del iframe, no contra el parámetro
  // de la URL: si aparece barra de scroll se come 15 px y todas las
  // comprobaciones de ancho quedan desplazadas.
  //
  // Y clientWidth, no innerWidth: innerWidth incluye la barra, mientras que los
  // porcentajes del CSS se calculan sobre clientWidth. Con 390 de iframe y
  // barra visible son 390 contra 375, y la comprobación del marco del gato
  // fallaba por esos 15 px.
  const VW = d.documentElement.clientWidth;
  const VH = d.documentElement.clientHeight;
  const movil = VW <= 900;
  const seccion = (id) => d.getElementById(id);

  // ---- que los cuatro módulos hayan arrancado ----------------------------
  // Mirar sólo el tamaño del lienzo no basta: con un resize adelantándose a la
  // carga de la imagen, el lienzo queda dimensionado y en blanco. Hay que
  // comprobar que de verdad se escribieron píxeles.
  const lienzos = ['dust', 'gatoCanvas', 'mano', 'probsCanvas'].map((id) => {
    const c = d.getElementById(id);
    if (!c || !c.width || !c.height) return id + ':falta';
    const px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let opacos = 0;
    for (let i = 3; i < px.length; i += 4000) if (px[i] > 0) opacos++;
    return opacos > 0 ? null : id + ':en blanco';
  }).filter(Boolean);
  comprobar('el campo de puntos pinta en las 4 secciones',
    lienzos.length === 0, lienzos.join('  ') || 'los 4 con píxeles escritos');

  // ---- header ------------------------------------------------------------
  w.scrollTo(0, 0);
  await esperar(500);

  const hLogo = rect(d, '.header__logo'), hTag = rect(d, '.tagline');
  const hCita = rect(d, '.header__cita'), hBaj = rect(d, '.header__bajar');
  const hSec = rect(d, '.header__seccion');
  comprobar('header: los seis elementos están y caben en pantalla',
    [hLogo, hTag, hCita, hBaj, hSec].every((r) => r && r.w > 0 &&
      r.x >= -1 && r.x + r.w <= VW + 1 && r.y >= -1 && r.y + r.h <= VH + 1),
    `logo ${hLogo.w}px · cita ${hCita.w}x${hCita.h} · flecha ${hBaj.w}px`);

  // el logo sube a la barra en escritorio y baja al centro en móvil
  comprobar('header: el logo cae donde lo pone la maqueta',
    movil ? Math.abs((hLogo.y + hLogo.h / 2) / VH - 0.433) < 0.03
          : Math.abs((hLogo.y + hLogo.h / 2) / VH - 0.025) < 0.02,
    `centro en ${(((hLogo.y + hLogo.h / 2) / VH) * 100).toFixed(1)}% del alto`);

  // la frase va centrada en escritorio y baja al 75% en móvil
  comprobar('header: la frase cae donde la pone la maqueta',
    Math.abs((hTag.y + hTag.h / 2) / VH - (movil ? 0.753 : 0.496)) < 0.03,
    `centro en ${(((hTag.y + hTag.h / 2) / VH) * 100).toFixed(1)}% del alto`);

  // en móvil el menú se pliega tras el punto; en escritorio se ve la fila
  const menu = d.querySelector('.header__menu');
  const nav = d.querySelector('.header__nav');
  const menuVisible = w.getComputedStyle(menu).display !== 'none';
  const navVisible = w.getComputedStyle(nav).visibility === 'visible';
  comprobar('header: el menú se pliega en móvil y se despliega en escritorio',
    movil ? (menuVisible && !navVisible) : (!menuVisible && navVisible),
    movil ? 'punto visible, fila plegada' : 'fila visible, sin punto');

  if (movil) {
    menu.click();
    // Se espera al estado, no a un reloj: con la página cargando cuatro campos
    // de puntos el repintado puede tardar bastante más que la transición.
    let visible = false;
    for (let i = 0; i < 20 && !visible; i++) {
      await esperar(150);
      visible = w.getComputedStyle(nav).visibility === 'visible';
    }
    comprobar('header: el punto despliega los tres enlaces',
      visible && d.querySelectorAll('.header__enlace').length === 3,
      visible ? '' : 'el menú no llegó a mostrarse');
    menu.click();
    await esperar(500);
  } else {
    comprobar('header: los tres enlaces están escritos',
      Array.from(d.querySelectorAll('.header__enlace')).every((e) => e.textContent.trim()), '');
  }

  // El contenido del header espera al fondo. Lo que hay que garantizar es que
  // acabe visible: si la marca no llegara, el header se quedaría en blanco y
  // no habría ningún error que lo delatara.
  comprobar('header: el contenido aparece tras el fondo',
    d.documentElement.classList.contains('is-listo') &&
    +w.getComputedStyle(d.querySelector('.header__inner')).opacity > 0.95,
    'marca puesta y contenido a plena opacidad');

  // La palabra de la frase se teclea sola. Es un módulo sin rastro en el DOM
  // en reposo: si desaparece, la frase se queda muda y nada lo delata. Ya pasó
  // una vez, borrado por un reemplazo de bloque.
  const palabra = d.getElementById('taglineWord');
  const vistas = new Set();
  for (let i = 0; i < 22; i++) { vistas.add(palabra.textContent); await esperar(140); }
  comprobar('header: la palabra de la frase se teclea sola',
    vistas.size > 3 && d.querySelectorAll('.tagline__sizer').length >= 4,
    `${vistas.size} estados distintos · ${d.querySelectorAll('.tagline__sizer').length} medidores`);

  // Los tres elementos del canal izquierdo tienen que salir del mismo margen.
  // Se compara el `left` calculado y no la caja, porque el rótulo vertical
  // lleva un margen negativo que compensa el centrado de sus glifos: la caja
  // queda corrida a propósito, pero el origen debe ser el mismo.
  const margen = w.getComputedStyle(d.documentElement).getPropertyValue('--margen');
  const izqDe = (sel) => w.getComputedStyle(d.querySelector(sel)).left;
  const anclados = movil
    ? ['.idioma', '.header__seccion', '.header__cita']
    : ['.idioma', '.header__seccion'];
  const lefts = anclados.map(izqDe);
  comprobar('header: el canal izquierdo sale de un único margen',
    lefts.every((v) => v === lefts[0]),
    anclados.map((s, i) => s.replace('.header__', '').replace('.', '') + ' ' + lefts[i]).join('  '));

  // El interruptor comparte eje con el punto del menú en móvil y con el logo
  // y la fila de enlaces en escritorio.
  const centroDe = (sel) => { const r = d.querySelector(sel).getBoundingClientRect();
    return (r.top + r.bottom) / 2; };
  const refEje = movil ? '.header__menu' : '.header__logo';
  const desfase = Math.abs(centroDe('.idioma') - centroDe(refEje));
  comprobar('header: el interruptor comparte eje con ' + (movil ? 'el punto' : 'el logo'),
    desfase < 1, `desfase ${desfase.toFixed(2)}px`);

  // El testimonio entra solo: un segundo quieto y luego un fundido lento. Si
  // se quedara en opacidad 0 no habría ningún error en consola, así que se
  // espera a que termine en vez de dar por hecho que está.
  const elCita = d.querySelector('.header__cita');
  let opCita = 0;
  for (let i = 0; i < 40 && opCita < 0.99; i++) {
    await esperar(150);
    opCita = +w.getComputedStyle(elCita).opacity;
  }
  comprobar('header: el testimonio termina visible tras su fundido',
    opCita > 0.95, `opacidad ${opCita}`);

  // ---- gato: coreografía de scroll ---------------------------------------
  const gato = seccion('gato');
  const top0 = gato.getBoundingClientRect().top + w.scrollY;
  const rec = gato.offsetHeight - w.innerHeight;
  const leer = () => ({
    frase: Array.from(d.querySelectorAll('.gato__frase')).findIndex((f) => f.classList.contains('is-in')),
    trazos: Array.from(d.querySelectorAll('.gato__traza path'))
      .filter((t) => (t.style.strokeDashoffset || '').startsWith('0')).length,
    malla: d.getElementById('gatoMalla').classList.contains('is-in')
  });

  const hitos = [];
  const esperadas = [-1, 1, 3, 5];
  for (let k = 0; k < 4; k++) {
    const q = [0.02, 0.25, 0.50, 0.75][k];
    w.scrollTo(0, Math.round(top0 + q * rec));
    await esperarA(() => leer().frase === esperadas[k], 5000);
    hitos.push({ q, ...leer() });
  }
  comprobar('gato: la frase avanza con el scroll',
    hitos[0].frase === -1 && hitos[1].frase >= 1 && hitos[3].frase === 5,
    hitos.map((h) => `q${h.q}→frase ${h.frase}`).join('  '));
  comprobar('gato: la traza se dibuja',
    hitos[1].trazos >= 1 && hitos[3].trazos === 5,
    hitos.map((h) => `q${h.q}→${h.trazos}/5`).join('  '));
  comprobar('gato: la malla final se cierra', hitos[3].malla, '');

  // El marco lleva números y trazos; el lienzo se amplía por separado desde
  // app.js. Si se desincronizan, los números dejan de caer sobre el gato.
  const gm = rect(d, '.gato__marco');
  comprobar('gato: marco y lienzo con el mismo encuadre',
    movil ? Math.abs(gm.w - VW * 1.8) < 6 : Math.abs(gm.w - Math.min(VW, VH * 2560 / 1696)) < 6,
    `marco ${gm.w}px de ancho`);

  // La tarjeta crece con la frase que le toque. La 5 es la más larga y era la
  // única que llegaba al borde inferior, así que hay que recorrer las seis.
  const tarj = [];
  for (let k = 0; k < 6; k++) {
    const q = [0.10, 0.23, 0.35, 0.47, 0.60, 0.72][k];
    w.scrollTo(0, Math.round(top0 + q * rec));
    await esperarA(() => {
      const a = Array.from(d.querySelectorAll('.gato__frase')).findIndex((f) => f.classList.contains('is-in'));
      return a === k;
    }, 5000);
    const r = d.getElementById('gatoTarjeta').getBoundingClientRect();
    tarj.push({ n: tarj.length + 1, aire: Math.round(VH - r.bottom), alto: Math.round(r.height) });
  }
  const apretada = tarj.filter((c) => c.aire < 24);
  comprobar('gato: la tarjeta no toca el borde inferior en ninguna frase',
    apretada.length === 0,
    apretada.length ? apretada.map((c) => `frase ${c.n}: ${c.aire}px`).join('  ')
                    : 'aire mínimo ' + Math.min(...tarj.map((c) => c.aire)) + 'px');

  const nums = Array.from(d.querySelectorAll('.gato__num')).map((e) => e.getBoundingClientRect());
  const ancho = Math.max(...nums.map((r) => r.left)) - Math.min(...nums.map((r) => r.left));
  // En móvil el marco desborda la pantalla y la constelación abarca ~63%; en
  // escritorio cabe entero y abarca ~33%, que es lo que marca la maqueta. El
  // caso que hay que atrapar es el marco encogido, con los números apiñados.
  comprobar('gato: los números quedan repartidos, no apiñados',
    ancho > VW * (movil ? 0.5 : 0.25),
    `abarcan ${Math.round(ancho)}px de ${VW} (${Math.round(ancho / VW * 100)}%)`);

  // ---- problemas ---------------------------------------------------------
  const probs = seccion('probs');
  w.scrollTo(0, probs.getBoundingClientRect().top + w.scrollY);
  await esperar(600);

  const cuadro = rect(d, '.probs__cuadro'), barra = rect(d, '.probs__abajo');
  comprobar('problemas: la barra va debajo del cuadro, sin solaparlo',
    barra.y >= cuadro.y + cuadro.h - 2, `cuadro acaba en ${cuadro.y + cuadro.h}, barra empieza en ${barra.y}`);
  comprobar('problemas: nada se sale del marco por los lados',
    cuadro.x >= 0 && cuadro.x + cuadro.w <= VW + 1, `cuadro ${cuadro.x}…${cuadro.x + cuadro.w} de ${VW}`);

  // el polígono cubre el marco entero: sin pointer-events:none roba los clics
  const puntos = Array.from(d.querySelectorAll('.probs__punto'));
  const alcanzables = puntos.filter((b) => {
    const r = b.getBoundingClientRect();
    const e = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    return e && e.classList && e.classList.contains('probs__punto');
  }).length;
  comprobar('problemas: los 10 puntos del menú reciben el toque',
    alcanzables === puntos.length, `${alcanzables}/${puntos.length} alcanzables`);

  // la mitad de la frase tiene que caber dentro del polígono, en las 10
  let desborde = 0;
  const arriba = d.querySelector('.probs__arriba');
  const poli = d.getElementById('probsPoli');
  for (let i = 0; i < puntos.length; i++) {
    puntos[i].click();
    await esperar(300);
    if (arriba.getBoundingClientRect().height > poli.getBoundingClientRect().height * 0.68) desborde++;
  }
  comprobar('problemas: las 10 frases caben en el polígono',
    desborde === 0, desborde ? `${desborde} se desbordan` : 'ninguna se desborda');

  // ---- mano --------------------------------------------------------------
  const mano = seccion('quehace');
  const mTop = mano.getBoundingClientRect().top + w.scrollY;
  const mRec = mano.offsetHeight - w.innerHeight;
  // Venir del final del documento a veces deja el primer scrollTo sin efecto,
  // así que se comprueba dónde cayó y se reintenta.
  const irMano = async (q) => {
    const objetivo = Math.round(mTop + q * mRec);
    for (let intento = 0; intento < 3; intento++) {
      w.scrollTo(0, objetivo);
      await esperar(intento === 0 ? 400 : 250);
      if (Math.abs(w.scrollY - objetivo) < 4) break;
    }
    // y esperar a que la sección repinte con ese avance
    const esperadoPct = Math.round(q * 100) + '%';
    await esperarA(() => d.getElementById('quehaceProgreso').textContent === esperadoPct, 5000);
  };

  const tx = (sel) => {
    const m = w.getComputedStyle(d.querySelector(sel)).transform;
    const n = /matrix\(([^)]+)\)/.exec(m);
    return n ? parseFloat(n[1].split(',')[4]) : 0;
  };

  const leerCintas = () => ({ t: tx('.quehace__titular'), f: tx('.quehace__fases'),
    q: +(-mano.getBoundingClientRect().top / mRec).toFixed(2), y: w.scrollY });
  await irMano(0.15);
  const a = leerCintas();
  await irMano(0.65);
  const b = leerCintas();
  comprobar('mano: las dos cintas cruzan en sentidos opuestos',
    b.t < a.t - 50 && b.f > a.f + 50,
    `titular ${Math.round(a.t)}→${Math.round(b.t)}  fases ${Math.round(a.f)}→${Math.round(b.f)}` +
    `  ·  scroll ${a.y}→${b.y}, q ${a.q}→${b.q}`);

  comprobar('mano: el porcentaje sigue al recorrido',
    d.getElementById('quehaceProgreso').textContent === '65%',
    d.getElementById('quehaceProgreso').textContent);

  // La promesa de la sección: ninguna letra puede quedar encima de la mano.
  // Se lee el píxel del lienzo justo debajo del centro de cada letra.
  const lienzo = d.getElementById('mano');
  const ctxMano = lienzo.getContext('2d');
  const rl = lienzo.getBoundingClientRect();
  const escX = lienzo.width / rl.width, escY = lienzo.height / rl.height;
  const encima = [];
  for (const q of [0.2, 0.4, 0.6, 0.8]) {
    await irMano(q);
    const px = ctxMano.getImageData(0, 0, lienzo.width, lienzo.height).data;
    const letras = d.querySelectorAll('.let');
    for (let i = 0; i < letras.length; i += 3) {
      const r = letras[i].getBoundingClientRect();
      if (!r.width) continue;
      const cx = Math.round(((r.left + r.right) / 2 - rl.left) * escX);
      const cy = Math.round(((r.top + r.bottom) / 2 - rl.top) * escY);
      if (cx < 4 || cy < 4 || cx >= lienzo.width - 4 || cy >= lienzo.height - 4) continue;
      // Se promedia un bloque: el campo de puntos es estocástico y un punto
      // suelto debajo de una letra es grano, no mano. Sólo cuenta si la zona
      // entera es maciza.
      let suma = 0, n = 0;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
        suma += px[((cy + dy) * lienzo.width + (cx + dx)) * 4]; n++;
      }
      if (suma / n < 95) encima.push(q + ':' + letras[i].textContent);
    }
  }
  comprobar('mano: ninguna letra queda sobre la mano',
    encima.length === 0,
    encima.length ? encima.slice(0, 6).join(' ') + ` (${encima.length})` : 'campo despejado en los 4 tramos');

  // Fuera del campo la letra tiene que volver a su sitio, no quedarse torcida.
  await irMano(0.02);
  const torcidas = Array.from(d.querySelectorAll('.let')).filter((e) => e.style.transform).length;
  comprobar('mano: fuera del campo las letras vuelven a su sitio',
    torcidas < 40, `${torcidas} con transformación al entrar`);

  // las píldoras siguen a la cinta
  await irMano(0.12);
  const p1 = Array.from(d.querySelectorAll('.hito')).findIndex((h) => h.classList.contains('is-activo'));
  await irMano(0.9);
  const p4 = Array.from(d.querySelectorAll('.hito')).findIndex((h) => h.classList.contains('is-activo'));
  comprobar('mano: la píldora activa avanza con la cinta',
    p1 === 0 && p4 === 3, `${p1 + 1} → ${p4 + 1}`);

  // ---- el interruptor de idioma no pisa nada -----------------------------
  // Va fijo en la esquina superior izquierda, que es donde varias secciones
  // ponen su rótulo pequeño.
  const bot = d.querySelector('.idioma').getBoundingClientRect();
  const pisados = [];
  for (const s2 of ['.quehace__seccion', '.quehace__rotulo', '.gato__rotulo',
                    '.probs__rotulo', '.probs__titulo', '.tagline']) {
    for (const sec2 of ['header', 'quehace', 'gato', 'probs']) {
      const el = d.querySelector('#' + sec2 + ' ' + s2) || (sec2 === 'header' && d.querySelector(s2));
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (!r.width) continue;
      if (bot.left < r.right + 6 && r.left < bot.right + 6 &&
          bot.top < r.bottom + 6 && r.top < bot.bottom + 6) pisados.push(s2);
    }
  }
  comprobar('el interruptor de idioma no pisa ningún rótulo',
    pisados.length === 0, pisados.join('  ') || 'con holgura en las cuatro secciones');

  // ---- sin scroll horizontal en toda la página ---------------------------
  comprobar('la página no se desplaza en horizontal',
    d.documentElement.scrollWidth <= VW + 1,
    `${d.documentElement.scrollWidth}px de ancho`);

  // ---- pintar ------------------------------------------------------------
  const fallos = pruebas.filter((t) => !t.ok).length;
  salida.innerHTML = '<h2>Resultado</h2><table>' + pruebas.map((t) =>
    `<tr><td class="${t.ok ? 'ok' : 'mal'}"></td><td class="${t.ok ? '' : 'mal'}">${t.nombre}` +
    (t.detalle ? `<br><span style="color:#888">${t.detalle}</span>` : '') + '</td></tr>').join('') + '</table>';
  document.getElementById('resumen').innerHTML = fallos
    ? `<span style="color:#f77">${fallos} de ${pruebas.length} fallan</span>`
    : `<span style="color:#7c7">las ${pruebas.length} pasan</span>`;
}

document.getElementById('run').addEventListener('click', correr);
</script>
</html>
